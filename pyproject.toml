[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lucy-short-video-marketing-analytics"
version = "0.0.0"
description = "Reproducible short-video marketing analytics research portfolio"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "duckdb>=1.3,<2",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "jupyterlab>=4.2,<5",
  "nbclient>=0.10,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["lucy_marketing_analytics*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
